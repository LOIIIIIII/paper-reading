<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">vLLM Serving：调度与内存管理协同</text><text x="60" y="94" class="s">高吞吐来自多个机制共同工作，而不是某一个单独开关。</text>
<rect x="90" y="150" width="1020" height="85" rx="20" fill="#fff" stroke="#dde3e8"/><text x="390" y="202" class="m">OpenAI-Compatible API / Request Queue</text>
<rect x="90" y="275" width="300" height="190" rx="20" fill="#eef4f9" stroke="#ccd9e5"/><text x="135" y="320" class="m">Scheduler</text><text x="135" y="355" class="s">running / waiting</text><text x="135" y="388" class="s">token budget</text><text x="135" y="421" class="s">Continuous Batching</text>
<rect x="450" y="275" width="300" height="190" rx="20" fill="#edf6f2" stroke="#cfe5dc"/><text x="495" y="320" class="m">KV Block Manager</text><text x="495" y="355" class="s">Paged KV Cache</text><text x="495" y="388" class="s">block allocation / recycle</text><text x="495" y="421" class="s">prefix reuse</text>
<rect x="810" y="275" width="300" height="190" rx="20" fill="#f7f2fb" stroke="#ddd5ee"/><text x="855" y="320" class="m">Model Executor</text><text x="855" y="355" class="s">Prefill / Decode</text><text x="855" y="388" class="s">Chunked Prefill</text><text x="855" y="421" class="s">GPU kernels</text>
<path d="M600 235v35M390 370h50M750 370h50" stroke="#9aa8b6" stroke-width="6" stroke-linecap="round"/><text x="90" y="555" class="s">Scheduler 决定“谁运行”，KV Manager 决定“状态放哪里”，Executor 决定“怎样真正执行”。</text></svg>