<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">Static → Dynamic → Continuous Batching</text><text x="60" y="94" class="s">变化的核心是：batch 形成得越来越晚，成员也越来越能在运行时动态变化。</text>
<g transform="translate(70 155)"><rect width="310" height="400" rx="22" fill="#fff" stroke="#dde3e8"/><text x="28" y="46" class="m">Static</text><text x="28" y="80" class="s">执行前固定成员</text><rect x="35" y="125" width="220" height="30" rx="8" fill="#dcebe4"/><rect x="35" y="170" width="155" height="30" rx="8" fill="#e7e3f7"/><rect x="190" y="170" width="65" height="30" rx="8" fill="#f1f2f4"/><rect x="35" y="215" width="185" height="30" rx="8" fill="#f7eadf"/><rect x="220" y="215" width="35" height="30" rx="8" fill="#f1f2f4"/><text x="28" y="305" class="s">短序列结束后，位置</text><text x="28" y="335" class="s">仍被最长请求拖住。</text></g>
<g transform="translate(445 155)"><rect width="310" height="400" rx="22" fill="#fff" stroke="#dde3e8"/><text x="28" y="46" class="m">Dynamic</text><text x="28" y="80" class="s">执行前按到达窗口凑批</text><circle cx="65" cy="145" r="16" fill="#dcebe4"/><circle cx="115" cy="165" r="16" fill="#e7e3f7"/><circle cx="165" cy="135" r="16" fill="#f7eadf"/><path d="M80 220h150" stroke="#9aa8b6" stroke-width="5"/><text x="28" y="305" class="s">在线入口更灵活，</text><text x="28" y="335" class="s">但执行后成员通常不变。</text></g>
<g transform="translate(820 155)"><rect width="310" height="400" rx="22" fill="#eef4f9" stroke="#ccd9e5"/><text x="28" y="46" class="m">Continuous</text><text x="28" y="80" class="s">generation iteration 间持续换成员</text><rect x="35" y="125" width="105" height="30" rx="8" fill="#dcebe4"/><rect x="145" y="125" width="90" height="30" rx="8" fill="#f7eadf"/><rect x="35" y="170" width="70" height="30" rx="8" fill="#e7e3f7"/><rect x="110" y="170" width="125" height="30" rx="8" fill="#dcebe4"/><rect x="35" y="215" width="95" height="30" rx="8" fill="#f7eadf"/><rect x="135" y="215" width="100" height="30" rx="8" fill="#e7e3f7"/><text x="28" y="305" class="s">序列结束立即释放 slot，</text><text x="28" y="335" class="s">新请求后续 iteration 补入。</text></g></svg>