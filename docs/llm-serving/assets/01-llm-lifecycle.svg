<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">一次生成式 LLM 请求的生命周期</text><text x="60" y="94" class="s">Prefill 建立上下文，Decode 通过很多 generation iterations 逐步产生输出。</text>
<g transform="translate(70 165)"><rect width="170" height="95" rx="18" fill="#fff" stroke="#dde3e8"/><text x="35" y="42" class="m">Request</text><text x="30" y="70" class="s">prompt / history</text></g>
<g transform="translate(285 165)"><rect width="170" height="95" rx="18" fill="#fff" stroke="#dde3e8"/><text x="40" y="42" class="m">Tokenize</text><text x="39" y="70" class="s">text → tokens</text></g>
<g transform="translate(500 145)"><rect width="220" height="135" rx="18" fill="#edf6f2" stroke="#cfe5dc"/><text x="70" y="45" class="m" fill="#1a6d5b">Prefill</text><text x="35" y="78" class="s">process all prompt tokens</text><text x="35" y="108" class="s">build KV / recurrent state</text></g>
<g transform="translate(765 125)"><rect width="250" height="175" rx="18" fill="#eef4f9" stroke="#ccd9e5"/><text x="60" y="45" class="m">Decode Loop</text><text x="40" y="80" class="s">iteration 1 → token₁</text><text x="40" y="110" class="s">iteration 2 → token₂</text><text x="40" y="140" class="s">... until EOS</text></g>
<g transform="translate(1050 165)"><rect width="100" height="95" rx="18" fill="#fff" stroke="#dde3e8"/><text x="20" y="42" class="m">Reply</text></g>
<path d="M240 212h40M455 212h40M720 212h40M1015 212h30" stroke="#9aa8b6" stroke-width="7" stroke-linecap="round"/><rect x="470" y="390" width="660" height="140" rx="22" fill="#fff" stroke="#dde3e8"/><text x="505" y="430" class="m">为什么 Decode 特别适合做 iteration-level scheduling？</text><text x="505" y="468" class="s">答案本来就被拆成许多小步，每一轮之间都有机会调整 active set。</text><text x="505" y="500" class="s">Continuous Batching 正是利用了这个天然的“重排边界”。</text></svg>