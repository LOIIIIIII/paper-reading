<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">Qwen3.5 在 Ollama 中并行受限的原因链</text><text x="60" y="94" class="s">问题不是简单的“模型能不能并发”，而是 hybrid state 在特定 Runtime 中能否安全管理。</text>
<g transform="translate(70 170)"><rect width="235" height="300" rx="22" fill="#fff" stroke="#dde3e8"/><text x="28" y="48" class="m">Hybrid Architecture</text><text x="28" y="88" class="s">Attention KV Cache</text><text x="28" y="120" class="s">+ recurrent / GDN state</text><text x="28" y="165" class="s">每条 sequence 状态</text><text x="28" y="195" class="s">管理更复杂</text></g>
<g transform="translate(355 170)"><rect width="235" height="300" rx="22" fill="#fff" stroke="#dde3e8"/><text x="28" y="48" class="m">Multi-Slot History</text><text x="28" y="88" class="s">slot reuse</text><text x="28" y="120" class="s">checkpoint restore</text><text x="28" y="152" class="s">prompt cache</text><text x="28" y="195" class="s">曾出现 Chunk not found</text></g>
<g transform="translate(640 170)"><rect width="235" height="300" rx="22" fill="#faeeee" stroke="#eccfcf"/><text x="28" y="48" class="m" fill="#9a4343">Ollama Safety Gate</text><text x="28" y="88" class="s">qwen35 / qwen35moe</text><text x="28" y="120" class="s">当前仍在 blocklist</text><text x="28" y="165" class="s">numParallel → 1</text></g>
<g transform="translate(925 170)"><rect width="210" height="300" rx="22" fill="#eef4f9" stroke="#ccd9e5"/><text x="28" y="48" class="m">Observed Result</text><text x="28" y="88" class="s">客户端可并发</text><text x="28" y="120" class="s">服务端仍单 slot</text><text x="28" y="165" class="s">后续请求排队</text></g>
