<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">ORCA：Request-Level → Iteration-Level Scheduling</text><text x="60" y="94" class="s">自回归生成天然分成很多 iteration，因此调度也可以在每轮之间重组 active set。</text>
<rect x="70" y="160" width="470" height="390" rx="24" fill="#fff" stroke="#dde3e8"/><text x="110" y="205" class="m">Request-Level</text><text x="110" y="240" class="s">A 一旦进入，就长期占据位置</text><rect x="115" y="290" width="330" height="45" rx="10" fill="#dcebe4"/><text x="125" y="319" class="xs">A A A A A A A A</text><rect x="115" y="355" width="230" height="45" rx="10" fill="#e7e3f7"/><rect x="345" y="355" width="100" height="45" rx="10" fill="#f1f2f4"/><text x="125" y="384" class="xs">B B B B B</text><text x="110" y="475" class="s">短序列结束后的空位不能及时复用。</text>
<rect x="660" y="160" width="470" height="390" rx="24" fill="#eef4f9" stroke="#ccd9e5"/><text x="700" y="205" class="m">Iteration-Level</text><text x="700" y="240" class="s">每轮结束都可以更新 active set</text><rect x="705" y="290" width="110" height="42" rx="10" fill="#dcebe4"/><rect x="820" y="290" width="110" height="42" rx="10" fill="#e7e3f7"/><rect x="935" y="290" width="110" height="42" rx="10" fill="#f7eadf"/><text x="705" y="375" class="s">iter 1: A / B / C</text><text x="705" y="410" class="s">iter 2: A / C / D</text><text x="705" y="445" class="s">iter 3: A / D / E</text><text x="700" y="500" class="s">完成退出，新请求补入。</text></svg>