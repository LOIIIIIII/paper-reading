<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">Prefill 与 Decode 的资源画像</text><text x="60" y="94" class="s">两种阶段不同，因此现代 Scheduler 往往需要 token-level 而不是 request-level 的预算。</text>
<rect x="80" y="160" width="470" height="360" rx="24" fill="#edf6f2" stroke="#cfe5dc"/><text x="120" y="210" class="m">Prefill</text><text x="120" y="245" class="s">一次处理整段 prompt</text><rect x="120" y="290" width="360" height="56" rx="12" fill="#fff" stroke="#d8e5de"/><text x="145" y="325" class="xs">token₁ token₂ token₃ ... tokenₙ</text><text x="120" y="405" class="s">• 大矩阵计算</text><text x="120" y="438" class="s">• 通常更 compute-heavy</text><text x="120" y="471" class="s">• 长 prompt 会占据较多 token budget</text>
<rect x="650" y="160" width="470" height="360" rx="24" fill="#eef4f9" stroke="#ccd9e5"/><text x="690" y="210" class="m">Decode</text><text x="690" y="245" class="s">一轮只推进少量新 token</text><rect x="690" y="290" width="65" height="50" rx="10" fill="#fff"/><rect x="770" y="290" width="65" height="50" rx="10" fill="#fff"/><rect x="850" y="290" width="65" height="50" rx="10" fill="#fff"/><text x="708" y="321" class="xs">t1</text><text x="788" y="321" class="xs">t2</text><text x="868" y="321" class="xs">t3</text><text x="690" y="405" class="s">• 高频读取历史 KV / state</text><text x="690" y="438" class="s">• 常更受带宽和缓存影响</text><text x="690" y="471" class="s">• 对 ITL / TPOT 更敏感</text></svg>