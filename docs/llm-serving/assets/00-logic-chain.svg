<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">从单请求串行到 Continuous Batching</text><text x="60" y="94" class="s">每一步技术都对应前一步暴露出的系统问题。</text>
<g transform="translate(65 160)"><rect width="190" height="300" rx="22" fill="#fff" stroke="#dde3e8"/><text x="24" y="48" class="m">单请求</text><text x="24" y="84" class="s">低 QPS / 单用户</text><text x="24" y="120" class="s">串行足够简单稳定</text></g>
<g transform="translate(290 160)"><rect width="190" height="300" rx="22" fill="#fff" stroke="#dde3e8"/><text x="24" y="48" class="m">并发到达</text><text x="24" y="84" class="s">多用户 / API / RAG</text><text x="24" y="120" class="s">多个请求同时等待</text></g>
<g transform="translate(515 160)"><rect width="190" height="300" rx="22" fill="#fff" stroke="#dde3e8"/><text x="24" y="48" class="m">Queue</text><text x="24" y="84" class="s">若仍一次处理一条</text><text x="24" y="120" class="s">尾延迟持续增加</text></g>
<g transform="translate(740 160)"><rect width="190" height="300" rx="22" fill="#fff" stroke="#dde3e8"/><text x="24" y="48" class="m">多序列</text><text x="24" y="84" class="s">Runtime 维护多个</text><text x="24" y="120" class="s">active sequences</text></g>
<g transform="translate(965 160)"><rect width="170" height="300" rx="22" fill="#edf4f9" stroke="#ccd9e5"/><text x="18" y="48" class="m">Continuous</text><text x="18" y="78" class="m">Batching</text><text x="18" y="120" class="s">每轮动态组织</text><text x="18" y="150" class="s">执行集合</text></g>
<path d="M255 310h30M480 310h30M705 310h30M930 310h30" stroke="#9aa8b6" stroke-width="7" stroke-linecap="round"/><text x="65" y="545" class="s">主线：请求并发 → 排队 → 多 active sequences → 迭代级调度 → 更高 aggregate throughput</text></svg>