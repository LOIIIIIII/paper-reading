<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">怎样证明“真正的并发”</text><text x="60" y="94" class="s">最好同时收集客户端、Runtime 和系统吞吐三层证据。</text>
<rect x="75" y="165" width="310" height="330" rx="24" fill="#fff" stroke="#dde3e8"/><text x="115" y="210" class="m">1 · Client Timeline</text><text x="115" y="250" class="s">start / first token / end</text><rect x="115" y="300" width="190" height="28" rx="8" fill="#dcebe4"/><rect x="155" y="345" width="190" height="28" rx="8" fill="#e7e3f7"/><rect x="130" y="390" width="190" height="28" rx="8" fill="#f7eadf"/><text x="115" y="455" class="s">生成区间是否明显重叠？</text>
<rect x="445" y="165" width="310" height="330" rx="24" fill="#eef4f9" stroke="#ccd9e5"/><text x="485" y="210" class="m">2 · Runtime State</text><text x="485" y="250" class="s">running / waiting / slots</text><text x="485" y="295" class="s">active sequences &gt; 1?</text><text x="485" y="335" class="s">KV cache usage?</text><text x="485" y="375" class="s">scheduler logs?</text><text x="485" y="455" class="s">是否不是单纯排队？</text>
<rect x="815" y="165" width="310" height="330" rx="24" fill="#edf6f2" stroke="#cfe5dc"/><text x="855" y="210" class="m">3 · Throughput</text><text x="855" y="250" class="s">aggregate output tokens/s</text><text x="855" y="295" class="s">fixed workload wall time</text><text x="855" y="335" class="s">GPU utilization / VRAM</text><text x="855" y="455" class="s">系统单位时间产出是否提高？</text>
<text x="75" y="570" class="s">只有三层证据一致时，才能较有把握地说发生了有效的并发 Serving。</text></svg>