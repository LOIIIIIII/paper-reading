<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">为什么多序列 Decode 会自然走向 Batch</text><text x="60" y="94" class="s">单序列每轮工作量较小；将多个 sequence 的当前 token 合并，可以形成更大的张量计算。</text>
<rect x="70" y="160" width="430" height="370" rx="24" fill="#fff" stroke="#dde3e8"/><text x="105" y="205" class="m">Single Sequence Decode</text><text x="105" y="245" class="s">seq A → 1 token</text><rect x="105" y="280" width="95" height="48" rx="10" fill="#dfe8f3"/><text x="125" y="310" class="xs">hidden A</text><path d="M205 304h80" stroke="#9aa8b6" stroke-width="6"/><rect x="290" y="265" width="150" height="80" rx="12" fill="#f4f5f7"/><text x="320" y="310" class="xs">Model Weights</text><text x="105" y="405" class="s">每一轮都要访问大模型权重，</text><text x="105" y="435" class="s">但只服务一个新 token。</text>
<rect x="560" y="160" width="570" height="370" rx="24" fill="#edf6f2" stroke="#cfe5dc"/><text x="595" y="205" class="m">Batched Decode</text><text x="595" y="245" class="s">seq A / B / C / D → 同一轮共同执行</text><rect x="595" y="280" width="95" height="42" rx="10" fill="#dfe8f3"/><rect x="595" y="330" width="95" height="42" rx="10" fill="#e7e3f7"/><rect x="595" y="380" width="95" height="42" rx="10" fill="#f7eadf"/><rect x="595" y="430" width="95" height="42" rx="10" fill="#dcebe4"/><path d="M700 375h110" stroke="#9aa8b6" stroke-width="6"/><rect x="815" y="315" width="250" height="120" rx="14" fill="#fff" stroke="#dde3e8"/><text x="875" y="365" class="m">Model Weights</text><text x="855" y="398" class="s">一次执行服务更多 token</text><text x="70" y="600" class="s">Batching 的系统收益主要体现在 aggregate throughput，不等价于每个单请求 latency 都下降。</text></svg>