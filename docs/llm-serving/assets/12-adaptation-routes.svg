<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">Qwen3.5 并发适配：三条不同路线</text><text x="60" y="94" class="s">先确定实验目标，再选择 Runtime，避免把通用并发问题和 Hybrid 模型适配混在一起。</text>
<rect x="70" y="160" width="320" height="360" rx="24" fill="#edf6f2" stroke="#cfe5dc"/><text x="110" y="205" class="m">A · 验证通用并发</text><text x="110" y="245" class="s">Llama 3.2 / Qwen3 / Mistral</text><text x="110" y="285" class="s">+ Ollama / llama.cpp</text><text x="110" y="335" class="s">目标：</text><text x="110" y="370" class="s">证明 slots、stream overlap、</text><text x="110" y="400" class="s">aggregate throughput 正常。</text>
<rect x="440" y="160" width="320" height="360" rx="24" fill="#eef4f9" stroke="#ccd9e5"/><text x="480" y="205" class="m">B · 研究 Qwen3.5</text><text x="480" y="245" class="s">Qwen3.5 + vLLM</text><text x="480" y="280" class="s">Apple Silicon: vLLM-Metal</text><text x="480" y="335" class="s">目标：</text><text x="480" y="370" class="s">研究 hybrid state、cache、</text><text x="480" y="400" class="s">max_num_seqs 与并发容量。</text>
<rect x="810" y="160" width="320" height="360" rx="24" fill="#f7f2fb" stroke="#ddd5ee"/><text x="850" y="205" class="m">C · 保留 Ollama</text><text x="850" y="245" class="s">跟踪上游 blocklist</text><text x="850" y="280" class="s">与 backend state correctness</text><text x="850" y="335" class="s">目标：</text><text x="850" y="370" class="s">在 API / 生命周期体验不变的</text><text x="850" y="400" class="s">前提下等待稳定并行支持。</text></svg>