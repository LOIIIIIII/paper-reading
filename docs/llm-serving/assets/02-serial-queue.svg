<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">串行 Serving：排队时间如何累积</text><text x="60" y="94" class="s">单请求时没有问题；并发到达后，后续请求的端到端延迟会包含前面请求的执行时间。</text>
<text x="80" y="155" class="m">Timeline</text><line x1="170" y1="150" x2="1110" y2="150" stroke="#c8d0d9" stroke-width="3"/>
<text x="80" y="230" class="xs">Request A</text><rect x="180" y="205" width="220" height="40" rx="10" fill="#dcebe4"/><text x="250" y="231" class="xs">RUN</text>
<text x="80" y="300" class="xs">Request B</text><rect x="180" y="275" width="220" height="40" rx="10" fill="#f1f2f4"/><rect x="400" y="275" width="290" height="40" rx="10" fill="#e7e3f7"/><text x="250" y="301" class="xs">WAIT</text><text x="515" y="301" class="xs">RUN</text>
<text x="80" y="370" class="xs">Request C</text><rect x="180" y="345" width="510" height="40" rx="10" fill="#f1f2f4"/><rect x="690" y="345" width="170" height="40" rx="10" fill="#f7eadf"/><text x="390" y="371" class="xs">WAIT</text><text x="748" y="371" class="xs">RUN</text>
<text x="80" y="440" class="xs">Request D</text><rect x="180" y="415" width="680" height="40" rx="10" fill="#f1f2f4"/><rect x="860" y="415" width="230" height="40" rx="10" fill="#dfe8f3"/><text x="470" y="441" class="xs">WAIT</text><text x="945" y="441" class="xs">RUN</text>
<rect x="180" y="515" width="910" height="78" rx="15" fill="#fff" stroke="#dde3e8"/><text x="210" y="548" class="s">E2E Latency = Queue Time + Prefill + Decode</text><text x="210" y="576" class="s">请求越靠后，模型本身没变慢，但 Queue Time 会越来越大。</text></svg>