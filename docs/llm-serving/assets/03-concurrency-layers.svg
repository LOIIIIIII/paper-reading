<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">“并发”至少有四层不同含义</text><text x="60" y="94" class="s">客户端同时发请求，并不能自动推出 Runtime 或 GPU 已经共同执行这些请求。</text>
<g transform="translate(70 165)"><rect width="230" height="310" rx="22" fill="#fff" stroke="#dde3e8"/><text x="28" y="48" class="m">1 · Client</text><text x="28" y="86" class="s">async HTTP / threads</text><text x="28" y="120" class="s">证明请求同时提交</text></g>
<g transform="translate(345 165)"><rect width="230" height="310" rx="22" fill="#fff" stroke="#dde3e8"/><text x="28" y="48" class="m">2 · API / Queue</text><text x="28" y="86" class="s">同时接收多个请求</text><text x="28" y="120" class="s">也可能全部排队</text></g>
<g transform="translate(620 165)"><rect width="230" height="310" rx="22" fill="#eef4f9" stroke="#ccd9e5"/><text x="28" y="48" class="m">3 · Runtime</text><text x="28" y="86" class="s">admission / slots</text><text x="28" y="120" class="s">multiple active sequences</text></g>
<g transform="translate(895 165)"><rect width="230" height="310" rx="22" fill="#edf6f2" stroke="#cfe5dc"/><text x="28" y="48" class="m">4 · GPU</text><text x="28" y="86" class="s">batched model execution</text><text x="28" y="120" class="s">throughput 真正变化</text></g>
<path d="M300 320h35M575 320h35M850 320h35" stroke="#9aa8b6" stroke-width="7" stroke-linecap="round"/><text x="70" y="555" class="s">验证“真并发”需要跨层证据：时间区间重叠 + active sequences + aggregate throughput。</text></svg>