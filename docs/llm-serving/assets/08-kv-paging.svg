<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><style>.t{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#25364a}.m{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#315f8c}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#596579}.xs{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#667085}</style></defs><rect width="1200" height="680" fill="#fbfcfd"/><text x="60" y="62" class="t">KV Cache：连续预留 vs Paged Blocks</text><text x="60" y="94" class="s">并发上限不仅由 Scheduler 决定，也受 KV / state 内存容量限制。</text>
<rect x="70" y="155" width="470" height="410" rx="24" fill="#fff" stroke="#dde3e8"/><text x="110" y="200" class="m">Contiguous Reservation</text><text x="110" y="235" class="s">为每条序列预留一大段连续空间</text><rect x="110" y="285" width="330" height="44" rx="8" fill="#dcebe4"/><rect x="440" y="285" width="55" height="44" rx="8" fill="#f1f2f4"/><rect x="110" y="350" width="190" height="44" rx="8" fill="#e7e3f7"/><rect x="300" y="350" width="195" height="44" rx="8" fill="#f1f2f4"/><rect x="110" y="415" width="255" height="44" rx="8" fill="#f7eadf"/><rect x="365" y="415" width="130" height="44" rx="8" fill="#f1f2f4"/><text x="110" y="505" class="s">灰色：预留但未真正使用 → fragmentation</text>
<rect x="650" y="155" width="480" height="410" rx="24" fill="#eef4f9" stroke="#ccd9e5"/><text x="690" y="200" class="m">Paged / Block-Based KV</text><text x="690" y="235" class="s">按需分配固定大小 block，并允许非连续映射</text>
<g fill="#dfe8f3"><rect x="690" y="285" width="64" height="44" rx="8"/><rect x="762" y="285" width="64" height="44" rx="8"/><rect x="834" y="285" width="64" height="44" rx="8"/></g><g fill="#e7e3f7"><rect x="690" y="350" width="64" height="44" rx="8"/><rect x="762" y="350" width="64" height="44" rx="8"/></g><g fill="#f7eadf"><rect x="690" y="415" width="64" height="44" rx="8"/><rect x="762" y="415" width="64" height="44" rx="8"/><rect x="834" y="415" width="64" height="44" rx="8"/><rect x="906" y="415" width="64" height="44" rx="8"/></g><text x="690" y="505" class="s">完成后 block 回收，更适合动态长度和 Continuous Batching。</text></svg>